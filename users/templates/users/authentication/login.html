{% extends 'mainapp/base.html' %}
{% load static %}
{% block title %}Login - Organized Company{% endblock %}
{% block content %}
  <section id="login-view" class="login-wrap">
    <div class="login-card">
      <h1>OrderHub</h1>
      <p class="muted">Sign in to continue</p>
      <form id="login-form" method="post" action="{% url 'users:user-login' %}">
        {% csrf_token %}
        <label>
          {{ form.username.label }}
          {{ form.username }}
        </label>
        <label>
          {{ form.password.label }}
          {{ form.password }}
        </label>
        <button class="btn btn-primary" type="submit">Sign in</button>
      </form>
    </div>
  </section>
{% endblock %}
{% block extra_js %}
  <script src="{% static 'js/users.js' %}"></script>
{% endblock extra_js %}
